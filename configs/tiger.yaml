# Configuration for the tiger/ package pipeline. Single source of truth.
#
# configs/config.yaml was deleted: it belonged to the scripts/ MVP removed in
# a7c1e72, was read by nothing, and still carried pre-fix values (F4's
# copies_per_row: 15, IQR thresholds, the flat noise model) that read as live
# calibration.

data:
  sample_dir: "data/sample"            # bundled synthetic catalogue (committed)
  processed_dir: "data/processed"
  cache_dir: "data/cache_embeddings"
  outputs_dir: "data/outputs"
  schema: "configs/schema.yaml"

models:
  clip_model_name: "openai/clip-vit-base-patch32"   # reported baseline (do not change)
  # B7: the per-field probes run on their own encoder, separate from the
  # similarity path. Measured on the clean ABO catalogue (2026-09-14,
  # `compare-encoders`, committed at paper_assets/results/abo/encoder_comparison.json):
  #
  #             CLIP ViT-B/32   SigLIP base/16      n
  #   colour        0.545           0.604         7,791
  #   material      0.206           0.328         5,877
  #
  # Material is the field the roadmap calls the paper's weakest number, and
  # SigLIP gains 12.2 points on it (+59% relative). Only the probes move --
  # sim_full, the swap check and the LOO deltas stay on clip_model_name, so the
  # reported CLIP baseline and the detection comparison are untouched.
  #
  # Costs one extra pass over the images (cached per model by content hash).
  # Probe z-thresholds are per-encoder, so `calibrate` MUST be re-run before
  # `detect` after changing this. Set back to "" to share one encoder.
  probe_model_name: "google/siglip-base-patch16-224"
  # "auto" = cuda when a GPU is present, else cpu. This was "cpu", which is
  # right for a laptop and wrong for the Kaggle runs that produce every
  # reported number -- and it became expensive once the probes moved to SigLIP
  # base/16 (196 patches per image against CLIP ViT-B/32's 49, and a second
  # full pass over the catalogue). Weights and inference are unchanged; only
  # where they run changes.
  device: "auto"
  batch_size: 32
  # candidate encoders for the upgrade-path comparison (roadmap 3.3) and the
  # independent verifier (roadmap 6.4, partial). Second family = SigLIP.
  compare_encoders:
    - "openai/clip-vit-base-patch32"
    - "google/siglip-base-patch16-224"
  independent_verifier: "google/siglip-base-patch16-224"   # "" to disable

# Synthetic sample catalogue (roadmap 4.2 bundled dataset; replaces lost toy data)
synthgen:
  seed: 20260717
  products_per_category: 60            # 4 categories -> 240 unique products
  image_size: 224
  calibration_fraction: 0.5            # product-level split: calibration vs report

# Error injection (roadmap 1.1). Rates are per-row probabilities; the assignment
# is deterministic given the seed, and every injected error is verified to have
# actually changed the row (no-op noise is a hard failure).
noise:
  seed: 7
  copies_per_row: 1                    # duplication OFF by default (F4); if >1,
                                       # product_id is the duplicate-group key
  rates:
    swap_image: 0.10                   # image from a different product, any category
    swap_image_same_category: 0.03     # subtle variant: donor from same category
    color_flip: 0.06                   # attrs.color -> domain \ {current}, title updated
    near_color_flip: 0.02              # subtle variant: perceptually adjacent colour
    material_flip: 0.02
    attribute_drop: 0.02               # color attribute removed
    title_contradiction: 0.02          # title colour word changed, attrs left correct
    mixed_swap_color: 0.02             # E3: swap_image + color_flip on the same row
    missing_image: 0.01
  max_redraws: 20

sieve:
  threshold_method: "quantile"         # tau_k = Q_p of CLEAN calibration sims (F3)
  quantile_q: 0.02
  min_products_per_category: 8         # effective (unique-product) sample size gate (F4)
  global_quantile_q: 0.02
  # per-field contrastive probes (Phase 3; colour probe active from Phase 1)
  probes:
    fields: ["color", "material", "pattern"]
    z_margin: 2.0                      # declared value must lose by >= this many
                                       # clean-calibration std-devs to fire
    min_margin_raw: 0.005              # floor to guard against degenerate stds
  precision_floor: 0.85                # fusion (3.4): retained signals must meet
                                       # this precision on the calibration set

analyzer:
  knn_k: 8                             # Eq. 19 neighbourhood size
  swap_z_margin: 2.0                   # replaces the raw 0.01 margin (F5)

arbiter:
  gamma: 0.40                          # Eq. 22 confidence gate; lowered from 0.60 to allow more repairs
  # D14: a CLEAN verdict is not dismissed while a "contrary signal" is live.
  # This must be STRICTER than the Sieve's own probe threshold (z_margin 2.0,
  # i.e. z <= -2.0) or the guard cancels the path it guards: every probe-flagged
  # row arrives with the guard already tripped and can never be cleared.
  # Swept over 13,203 flagged calibration rows -- at -3.0 the clearances go
  # 15 -> 63 at precision 0.90; relaxing further buys nothing.
  dismiss_contrary_z: -3.0
  # Which signals may veto a dismissal. A signal belongs here only if it is
  # STRONG evidence the row is dirty; a weak one blocks clean and dirty rows
  # alike and just suppresses the path. `title_contradiction` measures 0.510
  # precision on ABO -- a coin flip -- and removing it from this set takes
  # clean-row clearances from 1.8% to 10.6% with precision unchanged (D19,
  # swept over 10,554 flagged rows). It stays an Arbiter feature, where the
  # model weighs it rather than vetoing on it.
  dismiss_contrary_signals: ["probe", "text_out_of_domain"]
  dismiss_threshold: 0.80              # CLEAN needs at least this p to dismiss a flag
  # D19: OFF. Dismissal reads p_top as "probability this row is clean", and on
  # held-out ABO data that is flat -- 68-83% actually clean across stated
  # confidences from 0.55 to 0.92. Measured end to end, precision was 0.392 at
  # p>=0.80 and FELL to 0.250 at 0.90, so no threshold rescues it. A dismissed
  # dirty row leaves the pipeline unseen, which is the outcome this system
  # exists to prevent. Every flagged clean row now escalates instead; the cost
  # is human review time, which is recoverable, rather than silent data loss,
  # which is not. Set true to re-enable the path (it is intact and tested).
  dismiss_enabled: false
  train_seeds: [1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014]
                                       # noise seeds over the CALIBRATION split;
                                       # last seed is held out for reliability
  t2v_policy:
    # Categories for which an image swap may be automated. A category absent
    # here is escalated to human review BEFORE schema validation or the gamma
    # gate is consulted (tiger/arbiter.py:242).
    #
    # This listed the four fashion categories only, so every ABO E2/E3 row --
    # electronics, furniture, kitchen, home_decor -- was force-escalated by a
    # fashion-only allowlist. The cross-domain run therefore never exercised
    # T2V at all, and RQ3's evidence covers V2T and escalation only. The high
    # ABO escalation rate was attributed to the `color` schema requirement (H10)
    # and to Arbiter underconfidence (H11); this gate sat upstream of both.
    allowed_categories: ["shirts", "shoes", "bags", "hats",
                         # ABO vertical A -- furnishing
                         "chair", "sofa", "table", "ottoman", "stool",
                         "rug", "lamp", "light_fixture", "wall_art",
                         # ABO vertical B -- accessories
                         "ring", "necklace", "earring",
                         "handbag", "suitcase", "hat"]
    max_cost_units: 5.0

verify:
  epsilon_quantile: 0.95               # eps = this quantile of |clean pair deltas|
  max_passes: 2
